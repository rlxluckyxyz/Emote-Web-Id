<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>LUCKY EMOTE WEB</title>
  <style>
    :root{color-scheme:dark;--bg:#090d18;--panel:#111827;--panel2:#151f31;--line:#26344b;--text:#f5f7ff;--muted:#9aa8bd;--blue:#6d8cff;--cyan:#4dd8e8}
    *{box-sizing:border-box}
    
    /* মোবাইলে ক্লিক ইস্যু ফিক্সের জন্য perspective সরানো হয়েছে */
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#314a83 0,transparent 38%),radial-gradient(ellipse at 92% 18%,#145466 0,transparent 32%),linear-gradient(145deg,#080b14,#111a2c 52%,#070a12);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    
    .wrap{width:min(1180px,94%);margin:auto;padding:28px 0 42px}
    header{display:flex;align-items:center;gap:20px;margin-bottom:32px;}
    
    /* লোগো আরও বড় করা হয়েছে */
    .logo{width:150px;height:150px;flex:0 0 150px;object-fit:cover;object-position:center;border-radius:20px;border:2px solid #9bb5ff;box-shadow:0 7px 0 #263b70,0 12px 0 #14213e,0 18px 30px #000b, inset 0 0 14px #ffffff35;transform:translateY(-5px);}
    
    .brand{font-size:clamp(22px,4.5vw,32px);font-weight:950;letter-spacing:1.4px;margin:0;text-shadow:0 2px 0 #526ba7,0 4px 0 #26385f,0 8px 18px #000b;}
    .sub{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.5px}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:18px 0 17px;flex-wrap:wrap}
    .hero h2{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}
    .stats{display:flex;gap:9px;flex-wrap:wrap}
    .stat{background:#111b2b;border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:var(--muted);font-size:12px}
    .stat strong{color:white;font-size:16px;margin-right:4px}
    
    /* ড্যাশবোর্ড থেকে 3D রোটেশন সরানো হয়েছে */
    .dashboard{background:linear-gradient(145deg,#263957 0%,#142238 24%,#0d1728 72%,#1c2c47 100%);border:1px solid #526b94;border-top:2px solid #8aa6df;border-radius:22px;padding:18px;box-shadow:0 2px 0 #080e1b,0 7px 0 #101b30,0 15px 0 #080e1b,0 28px 55px #000a,inset 0 1px 0 #ffffff30;}
    
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}
    .page-label{font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
    .item{min-width:0;background:linear-gradient(150deg,#344b70 0%,#1b2b46 35%,#101a2b 100%);border:1px solid #526d99;border-top:2px solid #819bc7;border-radius:15px;padding:11px;display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 0 #091222,0 5px 0 #0b1424,0 10px 17px #0007,inset 0 1px 0 #ffffff20;position:relative}
    
    .preview{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(145deg,#172943,#080f1c);border-radius:10px;overflow:hidden;border:1px solid #40577d;box-shadow:inset 0 3px 10px #0009,0 2px 0 #50688d;}
    .preview img{width:100%;height:100%;object-fit:contain;padding:7px}
    .id{font-size:12px;font-weight:750;letter-spacing:.3px;color:#e7edff;word-break:break-all;text-align:center}
    
    /* বাটন ক্লিক এবং z-index ফিক্স */
    .copy{width:100%;border:1px solid #9eb5ff;border-radius:9px;padding:10px 7px;background:linear-gradient(180deg,#91aaff 0%,#617df0 48%,#4059c4 100%);color:white;font-weight:850;font-size:12px;cursor:pointer;text-shadow:0 1px 2px #26366e;box-shadow:0 3px 0 #293d91,0 6px 12px #0007,inset 0 1px 0 #ffffff80;transition:transform .12s,box-shadow .12s;position:relative;z-index:99;user-select:none;-webkit-tap-highlight-color:transparent}
    .copy:active{transform:translateY(3px);box-shadow:0 0 0 #293d91,0 2px 5px #0007}
    .copy.done{background:linear-gradient(180deg,#48d5b0,#13866e);border-color:#91f2d7;box-shadow:0 3px 0 #075744,0 6px 12px #0007;}
    
    .pagination{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;margin:22px 0 2px;position:relative;z-index:99}
    .page-center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
    .page-buttons{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
    
    .page-btn{min-width:36px;height:36px;padding:0 9px;border:1px solid #405477;border-radius:9px;background:linear-gradient(180deg,#263957,#142238);color:#dce6ff;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #080e1b,0 4px 8px #0006;position:relative;z-index:99;user-select:none;-webkit-tap-highlight-color:transparent}
    .page-btn.active{background:linear-gradient(180deg,#a0b7ff,#526fe5);color:#fff;border-color:#c3d1ff;box-shadow:0 3px 0 #293d91,0 6px 12px #0007}
    .page-ellipsis{color:var(--muted);padding:0 4px;font-weight:800;user-select:none;align-self:center}
    .page-num{font-size:13px;color:var(--muted);min-width:85px;text-align:center}
    
    .nav{border:1px solid #405477;background:linear-gradient(180deg,#263957,#142238);color:#fff;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #080e1b,0 6px 12px #0006;transition:transform .12s,box-shadow .12s;position:relative;z-index:99;user-select:none;-webkit-tap-highlight-color:transparent}
    .nav:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #080e1b}
    .nav:disabled{opacity:.35;cursor:not-allowed}
    
    .empty{padding:45px 12px;text-align:center;color:var(--muted)}
    footer{text-align:center;color:#72819a;font-size:11px;margin-top:18px}
    
    /* মোবাইলের জন্য হোভার এফেক্ট বন্ধ করা হয়েছে যাতে ট্যাপ মিস না হয় */
    @media (hover: hover) {
      .item:hover{transform:translateY(-7px) scale(1.015);border-color:#a4bcff;box-shadow:0 4px 0 #243b68,0 11px 0 #101b30,0 22px 28px #0009,inset 0 1px 0 #ffffff45;}
      .copy:hover{filter:brightness(1.12);}
      .page-btn:hover{border-color:#a4bcff;transform:translateY(-2px)}
      .nav:hover:not(:disabled){border-color:#a4bcff;transform:translateY(-2px)}
    }

    @media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:570px){
      .wrap{width:94%;padding-top:19px}
      header{gap:12px; flex-direction: column; align-items: flex-start;}
      .logo{width:120px;height:120px;flex-basis:120px;border-radius:16px}
      .dashboard{padding:12px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .item{padding:9px}
      .hero h2{font-size:19px}
      .pagination{gap:8px}
      .nav{padding:10px 12px;font-size:12px}
      .page-center{gap:8px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/web.png" alt="Lucky Web logo" onerror="this.style.display='none'">
    <div><h1 class="brand">LUCKY EMOTE WEB</h1><p class="sub">EMOTE COLLECTION • COPY ID IN ONE TAP</p></div>
  </header>

  <section class="hero">
    <div><h2>Emote Dashboard</h2><p>Choose an emote and tap its ID button to copy.</p></div>
    <div class="stats"><div class="stat"><strong id="total">—</strong>Total Emotes</div><div class="stat"><strong id="pageCount">—</strong>Per Page</div></div>
  </section>

  <main class="dashboard">
    <div class="toolbar"><span class="page-label" id="range">Loading emotes…</span><span class="page-label" id="status" aria-live="polite"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No emote images found in the <b>emotes</b> folder.</div>

    <div class="pagination">
      <button class="nav" id="back" disabled aria-label="Previous page">← BACK</button>
      <div class="page-center">
        <div class="page-buttons" id="pageButtons" aria-label="Choose page"></div>
        <span class="page-num" id="page">Page 1</span>
      </div>
      <button class="nav" id="next" disabled aria-label="Next page">NEXT →</button>
    </div>
  </main>
  <footer>LUCKY EMOTE WEB · Powered by Python Flask</footer>
</div>
<script>
const PER_PAGE = 50;
let emotes = [];
let currentPage = 1;

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const pageButtons = document.getElementById('pageButtons');
const backBtn = document.getElementById('back');
const nextBtn = document.getElementById('next');
const pageNumEl = document.getElementById('page');
const totalEl = document.getElementById('total');
const pageCountEl = document.getElementById('pageCount');
const rangeEl = document.getElementById('range');
const emptyEl = document.getElementById('empty');

function getTotalPages() {
  return Math.max(1, Math.ceil(emotes.length / PER_PAGE));
}

function goToPage(page) {
  const totalPages = getTotalPages();
  if (!Number.isInteger(page) || page < 1 || page > totalPages) return;
  currentPage = page;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// মোবাইলের জন্য শক্তিশালী কপি ফাংশন
function fallbackCopyTextToClipboard(text) {
  // ১. আধুনিক ক্লিপবোর্ড API
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  }
  
  // ২. পুরনো execCommand পদ্ধতি (Input ট্যাগ দিয়ে, যা মোবাইলে ভালো কাজ করে)
  try {
    const textArea = document.createElement("input");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.top = "50%";
    textArea.style.left = "50%";
    textArea.style.transform = "translate(-50%, -50%)";
    textArea.style.opacity = "0.01"; // মোবাইল ব্রাউজারে কপি করার জন্য সামান্য ভিজিবল থাকতে হয়
    textArea.style.zIndex = "9999";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    textArea.setSelectionRange(0, 99999); // iOS এর জন্য
    const res = document.execCommand("copy");
    document.body.removeChild(textArea);
    return Promise.resolve(res);
  } catch (err) {
    return Promise.resolve(false);
  }
}

function renderPageButtons() {
  const totalPages = getTotalPages();
  pageButtons.innerHTML = '';

  const pages = [];
  if (totalPages <= 10) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (currentPage > 3) pages.push('…');
    const start = Math.max(2, currentPage - 2);
    const end = Math.min(totalPages - 1, currentPage + 2);
    for (let i = start; i <= end; i++) pages.push(i);
    if (currentPage < totalPages - 2) pages.push('…');
    pages.push(totalPages);
  }

  pages.forEach(p => {
    if (p === '…') {
      const span = document.createElement('span');
      span.className = 'page-ellipsis';
      span.textContent = '…';
      pageButtons.appendChild(span);
      return;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
    btn.textContent = String(p);
    
    // সরাসরি ক্লিক ইভেন্ট, stopPropagation সহ
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      goToPage(p);
    });
    
    pageButtons.appendChild(btn);
  });
}

function render() {
  const totalPages = getTotalPages();
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = emotes.slice(start, start + PER_PAGE);

  grid.innerHTML = '';
  emptyEl.hidden = emotes.length !== 0;

  pageItems.forEach(item => {
    const card = document.createElement('article');
    card.className = 'item';

    const preview = document.createElement('div');
    preview.className = 'preview';
    const img = document.createElement('img');
    img.src = item.url;
    img.alt = 'Emote ' + item.id;
    img.loading = 'lazy';
    preview.appendChild(img);

    const idEl = document.createElement('div');
    idEl.className = 'id';
    idEl.textContent = item.id;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.textContent = 'COPY ID';
    
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      
      const text = String(item.id);
      
      fallbackCopyTextToClipboard(text).then((success) => {
        if (success) {
          btn.textContent = 'COPIED ✓';
          btn.classList.add('done');
          statusEl.textContent = 'Copied ID: ' + text;
          setTimeout(() => {
            btn.textContent = 'COPY ID';
            btn.classList.remove('done');
          }, 1500);
        } else {
          // যদি একদমই কপি না হয়, তবে পপআপ আসবে
          prompt("Copy this ID manually:", text);
        }
      });
    });

    card.append(preview, idEl, btn);
    grid.appendChild(card);
  });

  rangeEl.textContent = emotes.length
    ? `Showing ${start + 1}–${Math.min(start + PER_PAGE, emotes.length)} of ${emotes.length} emotes`
    : '0 emotes';

  pageNumEl.textContent = `Page ${currentPage} / ${totalPages}`;
  backBtn.disabled = currentPage === 1;
  nextBtn.disabled = currentPage === totalPages || emotes.length === 0;
  renderPageButtons();
}

backBtn.addEventListener('click', (e) => {
  e.preventDefault();
  goToPage(currentPage - 1);
});

nextBtn.addEventListener('click', (e) => {
  e.preventDefault();
  goToPage(currentPage + 1);
});

async function load() {
  try {
    const response = await fetch('/api/emotes');
    if (!response.ok) throw new Error('Could not load emotes');
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error('Invalid emote list');
    emotes = data;
    totalEl.textContent = emotes.length;
    pageCountEl.textContent = PER_PAGE;
    render();
  } catch (error) {
    rangeEl.textContent = 'Could not load emotes. Start app.py and refresh.';
    statusEl.textContent = error.message;
  }
}

load();
</script>
</body>
</html>
